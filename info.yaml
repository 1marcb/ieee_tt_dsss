# Tiny Tapeout project information
project:
  title:        "JAMGUARD DSSS Anti-Jam Link"
  author:       "Marc Boudames"
  discord:      ""
  description:  "Gold-code DSSS modem with self-synchronising receiver, SECDED FEC, frequency hopping and a built-in jammer, 14.9 dB processing gain"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_1marcb_jamguard"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TX_DATA0 / cfg0 CODE_ID0 / cfg1 FEC_EN"
  ui[1]: "TX_DATA1 / cfg0 CODE_ID1 / cfg1 FRAME_EN"
  ui[2]: "TX_DATA2 / cfg0 CODE_ID2 / cfg1 FHSS_EN"
  ui[3]: "TX_DATA3 / cfg0 CODE_ID3 / cfg1 PBJ_EN"
  ui[4]: "TX_DATA4 / cfg0 CODE_ID4 / cfg1 JAM_FINE"
  ui[5]: "TX_DATA5 / cfg0 JAM_LVL0 / cfg1 DISP_PAGE0"
  ui[6]: "TX_DATA6 / cfg0 JAM_LVL1 / cfg1 DISP_PAGE1"
  ui[7]: "TX_DATA7 / cfg0 ACQ_EN / cfg1 TX_PINS_OFF"

  # Outputs
  uo[0]: "RX_DATA0 / status (see datasheet pages)"
  uo[1]: "RX_DATA1 / status"
  uo[2]: "RX_DATA2 / status"
  uo[3]: "RX_DATA3 / status"
  uo[4]: "RX_DATA4 / status"
  uo[5]: "RX_DATA5 / status"
  uo[6]: "RX_DATA6 / status LOCKED or JAM_NOW"
  uo[7]: "RX_DATA7 / status VALID or TX_BUSY"

  # Bidirectional pins
  uio[0]: "TX_START (in) / cfg0 RX_CODE0 / cfg1 HOP_FAST"
  uio[1]: "RX_CHIP (in) / cfg0 RX_CODE1 / cfg1 PBJ_BAND0"
  uio[2]: "RX_EPOCH (in) / cfg0 RX_CODE2 / cfg1 PBJ_BAND1"
  uio[3]: "LOOPBACK_EN (in) / cfg0 RX_CODE3"
  uio[4]: "JAM_EN (in) / cfg0 RX_CODE4"
  uio[5]: "DISP_SEL (in) / cfg PAGE_SEL"
  uio[6]: "TX_CHIP (out)"
  uio[7]: "TX_EPOCH (out)"

# Do not change!
yaml_version: 6
