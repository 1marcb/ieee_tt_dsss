name: fpga

on:
  # Enabled on every push: an iCE40 build is a second, independent synthesis
  # of the same RTL, and the bitstream is what exercises genuinely
  # asynchronous inputs on real hardware.
  push:
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttsky26e
